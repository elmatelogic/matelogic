<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Matelògic · El repte matemàtic diari</title>
  
  <meta name="description" content="Juga a Matelògic: troba totes les combinacions matemàtiques possibles fent servir el dígit central i descobreix el Tuti del dia.">
  <meta name="theme-color" content="#0f172a">

  <style>
    /* =========================================================
       VARIABLES I RESET GENERAL
       ========================================================= */
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --center-hex: #f59e0b;
      --center-hex-hover: #d97706;
      --outer-hex: #334155;
      --outer-hex-hover: #475569;
      --tuti-gold: #fbbf24;
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    }

    /* =========================================================
       CAPÇALERA I DADES DEL DIA
       ========================================================= */
    header {
      width: 100%;
      max-width: 520px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand .data-repte {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-icon {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s ease;
    }

    .btn-icon:hover {
      background: #334155;
    }

    /* Estrella del Tuti */
    .tuti-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      color: #64748b;
      transition: all 0.35s ease;
      cursor: default;
    }

    .tuti-badge .tuti-star-icon {
      width: 20px;
      height: 20px;
      fill: transparent;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.3s ease;
    }

    .tuti-badge .tuti-count {
      font-weight: 700;
      font-size: 0.85rem;
      display: none;
    }

    .tuti-badge.actiu {
      color: var(--tuti-gold);
      background: rgba(245, 158, 11, 0.16);
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.3);
    }

    .tuti-badge.actiu .tuti-star-icon {
      fill: var(--tuti-gold);
    }

    .tuti-badge.actiu .tuti-count {
      display: inline;
    }

    @keyframes batecEstrella {
      0% { transform: scale(1); }
      35% { transform: scale(1.3) rotate(12deg); filter: drop-shadow(0 0 8px #fbbf24); }
      70% { transform: scale(0.95) rotate(-6deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .tuti-animacio {
      animation: batecEstrella 0.55s ease-in-out;
    }

    /* =========================================================
       CONTENIDOR PRINCIPAL I OBJECTIU
       ========================================================= */
    main {
      width: 100%;
      max-width: 480px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .panell-objectiu {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 18px;
      border-radius: var(--radius-md);
    }

    .target-box {
      display: flex;
      flex-direction: column;
    }

    .target-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .target-num {
      font-size: 2rem;
      font-weight: 800;
      color: #38bdf8;
      line-height: 1.1;
    }

    .stats-box {
      text-align: right;
    }

    .stats-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .stats-prog {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* =========================================================
       LÍNIA D'ENTRADA I OPERACIÓ ACTUAL
       ========================================================= */
    .display-operacio {
      width: 100%;
      min-height: 52px;
      background: rgba(15, 23, 42, 0.6);
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
      word-break: break-all;
    }

    .display-operacio.buit {
      color: rgba(255, 255, 255, 0.25);
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: normal;
    }

    /* =========================================================
       RUSC HEXAGONAL (7 XIFRES)
       ========================================================= */
    .hive-wrapper {
      position: relative;
      width: 260px;
      height: 250px;
      margin: 4px auto;
    }

    .hex-cell {
      position: absolute;
      width: 76px;
      height: 76px;
      clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s ease, filter 0.12s ease;
      touch-action: manipulation;
    }

    .hex-cell:active {
      transform: scale(0.92) !important;
    }

    /* Cel·la central */
    .hex-center {
      background: var(--center-hex);
      color: #0f172a;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .hex-center:hover {
      background: var(--center-hex-hover);
    }

    /* 6 Cel·les exteriors disposades geomètricament */
    .hex-outer {
      background: var(--outer-hex);
      z-index: 1;
    }

    .hex-outer:hover {
      background: var(--outer-hex-hover);
    }

    /* Posicions radials */
    .pos-0 { top: 0px; left: 92px; }
    .pos-1 { top: 44px; left: 168px; }
    .pos-2 { top: 132px; left: 168px; }
    .pos-3 { top: 176px; left: 92px; }
    .pos-4 { top: 132px; left: 16px; }
    .pos-5 { top: 44px; left: 16px; }

    /* =========================================================
       TECLAT D'OPERADORS I ACCIONS
       ========================================================= */
    .keypad-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .btn-key {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 12px 0;
      border-radius: var(--radius-sm);
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s ease;
    }

    .btn-key:active {
      transform: scale(0.95);
      background: #334155;
    }

    .action-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-action {
      border: none;
      padding: 12px 0;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .btn-action:active {
      transform: scale(0.97);
    }

    .btn-delete {
      background: #475569;
      color: #ffffff;
    }

    .btn-submit {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    /* =========================================================
       LLISTA DE SOLUCIONS TROBADES AVUI
       ========================================================= */
    .panell-solucions {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-top: 6px;
    }

    .panell-solucions h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .llista-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 120px;
      overflow-y: auto;
    }

    .solucio-tag {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      font-weight: 600;
    }

    .solucio-tag.es-tuti {
      border-color: var(--tuti-gold);
      background: rgba(245, 158, 11, 0.15);
      color: var(--tuti-gold);
    }

    /* =========================================================
       BOTÓ FLOTANT FIX DE COMPARTIR (100% Responsive)
       ========================================================= */
    .btn-flotant-compartir {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      right: calc(16px + env(safe-area-inset-right, 0px));
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 18px;
      min-height: 44px;
      
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #ffffff;
      border: none;
      border-radius: 9999px;
      
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.38), 0 2px 6px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-flotant-compartir:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.48);
    }

    .btn-flotant-compartir:active {
      transform: translateY(1px) scale(0.97);
    }

    /* Toast de feedback */
    .toast-notificacio {
      position: fixed;
      bottom: calc(72px + env(safe-area-inset-bottom, 0px));
      right: calc(16px + env(safe-area-inset-right, 0px));
      z-index: 1010;
      padding: 10px 16px;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px) scale(0.95);
      transition: all 0.25s ease;
      pointer-events: none;
    }

    .toast-notificacio.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    /* =========================================================
       FINESTRA MODAL (SOLUCIONS D'AHIR)
       ========================================================= */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }

    .modal-overlay.obert {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 440px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .btn-close-modal {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }

    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ahir-seccio-titol {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 4px;
    }

    /* Adaptació responsive mòbil */
    @media (max-width: 480px) {
      .btn-flotant-compartir {
        padding: 9px 14px;
        font-size: 0.85rem;
      }
      .toast-notificacio {
        right: 50%;
        transform: translateX(50%) translateY(12px) scale(0.95);
      }
      .toast-notificacio.visible {
        transform: translateX(50%) translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>

  <!-- CAPÇALERA -->
  <header>
    <div class="brand">
      <h1>Matelògic</h1>
      <span id="data-repte" class="data-repte">Carregant repte...</span>
    </div>
    <div class="header-actions">
      <!-- Indicador / Estrella del Tuti -->
      <div id="tuti-badge" class="tuti-badge" title="Tutis trobats avui">
        <svg class="tuti-star-icon" viewBox="0 0 24 24">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
        </svg>
        <span id="tuti-count" class="tuti-count"></span>
      </div>

      <button class="btn-icon" onclick="obrirModalAhir()">Ahir</button>
    </div>
  </header>

  <!-- PANELL CENTRAL DE JOC -->
  <main>
    <!-- Objectiu i marcador -->
    <div class="panell-objectiu">
      <div class="target-box">
        <span class="target-label">Objectiu</span>
        <span id="num-target" class="target-num">--</span>
      </div>
      <div class="stats-box">
        <span class="stats-label">Solucions</span>
        <span id="prog-solucions" class="stats-prog">0/--</span>
      </div>
    </div>

    <!-- Pantalla d'expressió en curs -->
    <div id="display-operacio" class="display-operacio buit">
      Fes clic als dígits i operadors...
    </div>

    <!-- Rusc hexagonal -->
    <div class="hive-wrapper">
      <button id="hex-0" class="hex-cell hex-outer pos-0" onclick="afegirToken(this.textContent)">-</button>
      <button id="hex-1" class="hex-cell hex-outer pos-1" onclick="afegirToken(this.textContent)">-</button>
      <button id="hex-2" class="hex-cell hex-outer pos-2" onclick="afegirToken(this.textContent)">-</button>
      <button id="hex-3" class="hex-cell hex-outer pos-3" onclick="afegirToken(this.textContent)">-</button>
      <button id="hex-4" class="hex-cell hex-outer pos-4" onclick="afegirToken(this.textContent)">-</button>
      <button id="hex-5" class="hex-cell hex-outer pos-5" onclick="afegirToken(this.textContent)">-</button>
      <button id="hex-center" class="hex-cell hex-center" onclick="afegirToken(this.textContent)">-</button>
    </div>

    <!-- Operadors matemàtics -->
    <div class="keypad-grid">
      <button class="btn-key" onclick="afegirToken('+')">+</button>
      <button class="btn-key" onclick="afegirToken('−')">−</button>
      <button class="btn-key" onclick="afegirToken('×')">×</button>
      <button class="btn-key" onclick="afegirToken('÷')">÷</button>
      <button class="btn-key" onclick="afegirToken('(')">(</button>
      <button class="btn-key" onclick="afegirToken(')')">)</button>
    </div>

    <!-- Accions d'edició i enviament -->
    <div class="action-grid">
      <button class="btn-action btn-delete" onclick="esborrarUltim()">⌫ Esborra</button>
      <button class="btn-action btn-submit" onclick="validarOperacio()">Comprova ✓</button>
    </div>

    <!-- Solucions trobades en la sessió d'avui -->
    <div class="panell-solucions">
      <h2>Solucions trobades (<span id="count-trobades">0</span>)</h2>
      <div id="llista-trobades" class="llista-tags"></div>
    </div>
  </main>

  <!-- BOTÓ FLOTANT FIX DE COMPARTIR -->
  <button id="btn-flotant-compartir" class="btn-flotant-compartir" type="button" onclick="compartirPartida()" aria-label="Comparteix la teva partida">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="3"></circle>
      <circle cx="6" cy="12" r="3"></circle>
      <circle cx="18" cy="19" r="3"></circle>
      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
      <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
    </svg>
    <span id="text-flotant-compartir">Comparteix</span>
  </button>

  <!-- TOAST DE CONFIRMACIÓ -->
  <div id="toast-notificacio" class="toast-notificacio" role="alert">Resultat copiat al porta-retalls! 📋</div>

  <!-- FINESTRA MODAL DE LES SOLUCIONS D'AHIR -->
  <div id="modal-ahir" class="modal-overlay" onclick="tancarModalAhir(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modal-ahir-titol">Solucions d'ahir</h3>
        <button class="btn-close-modal" onclick="tancarModalAhir()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="ahir-contingut-tutis" style="display: none;">
          <div class="ahir-seccio-titol">🌟 Tutis d'ahir</div>
          <div id="llista-ahir-tutis" class="llista-tags"></div>
        </div>
        <div>
          <div class="ahir-seccio-titol">Solucions representatives</div>
          <div id="llista-ahir-ordinaries" class="llista-tags"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- LÒGICA I COMUNICACIÓ AMB EL WORKER -->
  <script>
    // URL base del Cloudflare Worker (si està en el mateix domini es deixa buida "")
    const WORKER_URL = "";

    let estatJoc = {
      num: "",
      data: "",
      target: 0,
      center: null,
      outer: [],
      total: 24,
      operacioActual: "",
      solucionsTrobades: new Set(),
      comptadorTutis: 0
    };

    document.addEventListener("DOMContentLoaded", () => {
      carregarRepte();
    });

    // 1. Carregar el repte diari des del Worker
    async function carregarRepte() {
      try {
        const res = await fetch(`${WORKER_URL}/api/repte`, { cache: "no-store" });
        const data = await res.json();

        estatJoc.num = data.num;
        estatJoc.data = data.data;
        estatJoc.target = data.target;
        estatJoc.center = data.center;
        estatJoc.outer = data.outer;
        estatJoc.total = data.total;

        // Renderitzar textos a la interfície
        document.getElementById("data-repte").textContent = `#${data.num} · ${data.data}`;
        document.getElementById("num-target").textContent = data.target;
        document.getElementById("prog-solucions").textContent = `0/${data.total}`;

        // Assignar les xifres al rusc
        document.getElementById("hex-center").textContent = data.center;
        data.outer.forEach((digit, i) => {
          document.getElementById(`hex-${i}`).textContent = digit;
        });

        // Recuperar progrés desat de la data actual a localStorage
        recuperarProgresLocal(data.data);
      } catch (err) {
        console.error("Error carregant el repte", err);
        document.getElementById("data-repte").textContent = "Error de connexió";
      }
    }

    // 2. Manipulació de l'operació en pantalla
    function afegirToken(token) {
      if (estatJoc.operacioActual.length >= 120) return;
      estatJoc.operacioActual += token;
      actualitzarDisplay();
    }

    function esborrarUltim() {
      estatJoc.operacioActual = estatJoc.operacioActual.slice(0, -1);
      actualitzarDisplay();
    }

    function actualitzarDisplay() {
      const el = document.getElementById("display-operacio");
      if (estatJoc.operacioActual.length === 0) {
        el.textContent = "Fes clic als dígits i operadors...";
        el.classList.add("buit");
      } else {
        el.textContent = estatJoc.operacioActual;
        el.classList.remove("buit");
      }
    }

    // 3. Validació de l'operació amb el Cloudflare Worker
    async function validarOperacio() {
      if (!estatJoc.operacioActual) return;

      const expr = estatJoc.operacioActual;

      try {
        const res = await fetch(`${WORKER_URL}/api/validar`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ expressio: expr })
        });
        const data = await res.json();

        if (data.ok) {
          if (estatJoc.solucionsTrobades.has(data.canonic)) {
            mostrarToast("Ja havies trobat aquesta solució!");
          } else {
            estatJoc.solucionsTrobades.add(data.canonic);
            afegirSolucioALlista(expr, data.esTuti);

            if (data.esTuti) {
              estatJoc.comptadorTutis++;
              actualitzarEstrellaTuti();
              mostrarToast("🌟 IMPRESSIONANT! Has fet un Tuti!");
            } else {
              mostrarToast("Molt bé! Solució correcta ✓");
            }

            actualitzarComptadors();
            desarProgresLocal();
          }
          estatJoc.operacioActual = "";
          actualitzarDisplay();
        } else {
          mostrarToast(data.msg || "Operació no vàlida");
        }
      } catch (err) {
        mostrarToast("Error validant amb el servidor");
      }
    }

    function afegirSolucioALlista(expr, esTuti) {
      const contenidor = document.getElementById("llista-trobades");
      const tag = document.createElement("div");
      tag.className = "solucio-tag" + (esTuti ? " es-tuti" : "");
      tag.textContent = (esTuti ? "🌟 " : "") + expr;
      contenidor.prepend(tag);
    }

    function actualitzarEstrellaTuti() {
      const badge = document.getElementById("tuti-badge");
      const count = document.getElementById("tuti-count");

      if (estatJoc.comptadorTutis >= 1) {
        badge.classList.add("actiu");
        count.textContent = estatJoc.comptadorTutis > 1 ? `x${estatJoc.comptadorTutis}` : "";

        badge.classList.remove("tuti-animacio");
        void badge.offsetWidth;
        badge.classList.add("tuti-animacio");
      }
    }

    function actualitzarComptadors() {
      const quantes = estatJoc.solucionsTrobades.size;
      document.getElementById("prog-solucions").textContent = `${quantes}/${estatJoc.total}`;
      document.getElementById("count-trobades").textContent = quantes;

      const txtBtn = document.getElementById("text-flotant-compartir");
      txtBtn.textContent = quantes > 0 ? `Comparteix (${quantes}/${estatJoc.total})` : "Comparteix";
    }

    // 4. Compartir partida
    async function compartirPartida() {
      const trobades = estatJoc.solucionsTrobades.size;
      let tutiTxt = "Tuti: Pendent ⏳";
      if (estatJoc.comptadorTutis === 1) tutiTxt = "Tuti: Trobat! 🌟";
      if (estatJoc.comptadorTutis > 1) tutiTxt = `Tutis: ${estatJoc.comptadorTutis} trobats! 🌟✨`;

      const text = 
`Matelògic #${estatJoc.num} · ${estatJoc.data}
🎯 Objectiu assolit: ${estatJoc.target}
🧩 Solucions: ${trobades}/${estatJoc.total}
${tutiTxt}

Pots superar-me? https://matelogic.cat`;

      if (navigator.share) {
        try {
          await navigator.share({ title: "Matelògic", text: text });
          return;
        } catch (e) {}
      }

      try {
        await navigator.clipboard.writeText(text);
        mostrarToast("Resultat copiat al porta-retalls! 📋");
      } catch (err) {
        console.error("Error al portapapers", err);
      }
    }

    function mostrarToast(missatge) {
      const toast = document.getElementById("toast-notificacio");
      toast.textContent = missatge;
      toast.classList.add("visible");
      setTimeout(() => toast.classList.remove("visible"), 2600);
    }

    // 5. Modal de solucions d'ahir
    async function obrirModalAhir() {
      try {
        const res = await fetch(`${WORKER_URL}/api/ahir`, { cache: "no-store" });
        const data = await res.json();

        document.getElementById("modal-ahir-titol").textContent = `Solucions d'ahir (#${data.num} · ${data.data})`;

        const contTutis = document.getElementById("ahir-contingut-tutis");
        const llistaTutis = document.getElementById("llista-ahir-tutis");
        const llistaOrd = document.getElementById("llista-ahir-ordinaries");

        llistaTutis.innerHTML = "";
        llistaOrd.innerHTML = "";

        if (data.tutis && data.tutis.length > 0) {
          contTutis.style.display = "block";
          data.tutis.forEach(tuti => {
            const tag = document.createElement("div");
            tag.className = "solucio-tag es-tuti";
            tag.textContent = tuti;
            llistaTutis.appendChild(tag);
          });
        } else {
          contTutis.style.display = "none";
        }

        const tutisSet = new Set(data.tutis || []);
        data.solucions.forEach(s => {
          if (!tutisSet.has(s)) {
            const tag = document.createElement("div");
            tag.className = "solucio-tag";
            tag.textContent = s;
            llistaOrd.appendChild(tag);
          }
        });

        document.getElementById("modal-ahir").classList.add("obert");
      } catch (err) {
        mostrarToast("No s'han pogut carregar les solucions d'ahir");
      }
    }

    function tancarModalAhir(e) {
      document.getElementById("modal-ahir").classList.remove("obert");
    }

    // 6. Persistència de dades local (localStorage)
    function desarProgresLocal() {
      const dades = {
        data: estatJoc.data,
        tutis: estatJoc.comptadorTutis,
        solucions: Array.from(estatJoc.solucionsTrobades)
      };
      localStorage.setItem("matelogic_progres", JSON.stringify(dades));
    }

    function recuperarProgresLocal(dataActual) {
      try {
        const raw = localStorage.getItem("matelogic_progres");
        if (!raw) return;
        const dades = JSON.parse(raw);
        if (dades.data === dataActual) {
          estatJoc.comptadorTutis = dades.tutis || 0;
          if (estatJoc.comptadorTutis > 0) actualitzarEstrellaTuti();
          (dades.solucions || []).forEach(s => {
            estatJoc.solucionsTrobades.add(s);
            afegirSolucioALlista(s, false);
          });
          actualitzarComptadors();
        }
      } catch (e) {}
    }
  </script>
</body>
</html>
